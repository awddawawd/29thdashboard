[project]
name = "backfrontend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nothex", email = "anon" }
]
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "fastapi[standard]>=0.141.1",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psutil>=7.0.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backfrontend = "backfrontend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
