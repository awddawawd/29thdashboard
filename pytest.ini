[pytest]
# Les suites de ce dépôt sont des scripts autonomes (rapport + code de sortie) :
#   .venv/Scripts/python.exe tests/test_api_hardening.py
# Elles ne sont pas des modules pytest et sont donc explicitement exclues de la
# collecte automatique (sinon `pytest` les marque en échec).
addopts = --ignore=tests/test_api_hardening.py --ignore=tests/test_telemetry_hardening.py --ignore=tests/test_tenant_isolation.py
testpaths = tests
