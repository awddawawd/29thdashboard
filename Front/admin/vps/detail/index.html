<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Console VPS · Cockpit WaaS</title>
    <meta name="description" content="Administration du conteneur d'une vitrine : cycle de vie, ressources, disponibilité 90 jours, console et journaux.">
    <!-- @include head.html -->
  </head>
  <body>
    <!-- @include body-start.html brand="Cockpit WaaS" -->

    <div class="ck-app" id="cockpit-app">
      <!-- @include admin/sidebar.html -->
      <div class="ck-scrim"></div>

      <div class="ck-main">
        <!-- @include admin/topbar.html title="Serveur VPS" -->

        <main class="ck-content" id="main" tabindex="-1">
          <div class="ck-stack" id="vps-root">
            <div class="ck-page-head" id="vps-head">
              <!-- @include skeleton/page-head.html -->
            </div>
            <div id="vps-banner" hidden></div>

            <article class="ck-card" id="vps-panel">
              <header class="ck-card__header">
                <div class="ck-card__heading">
                  <h2 class="ck-card__title">Conteneur</h2>
                  <p class="ck-card__subtitle ck-mono" id="vps-panel-sub"><span class="ck-skeleton ck-skeleton--text ck-skeleton--w45"></span></p>
                </div>
                <div class="ck-card__actions" id="vps-actions">
                  <span class="ck-skeleton ck-skeleton--pill"></span>
                  <span class="ck-skeleton ck-skeleton--pill"></span>
                </div>
              </header>
              <div class="ck-card__body" id="vps-stats">
                <!-- @include skeleton/stats.html -->
              </div>
            </article>

            <article class="ck-card">
              <header class="ck-card__header">
                <div class="ck-card__heading">
                  <h2 class="ck-card__title">Disponibilité de la vitrine — 90 jours</h2>
                  <p class="ck-card__subtitle" id="vps-avail-sub"><span class="ck-skeleton ck-skeleton--text ck-skeleton--w55"></span></p>
                </div>
                <div class="ck-card__actions">
                  <button type="button" class="ck-btn ck-btn--secondary ck-btn--xs" id="btn-probe">
                    <svg class="ck-icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>Vérifier maintenant</span>
                  </button>
                </div>
              </header>
              <div class="ck-card__body">
                <div id="vps-avail-note"></div>
                <div id="vps-avail">
                  <div class="ck-stack" style="--ck-stack-gap: var(--ck-space-16)">
                    <!-- @include skeleton/stats.html -->
                    <!-- @include skeleton/bars.html -->
                    <!-- @include skeleton/legend.html -->
                  </div>
                </div>
              </div>
            </article>

            <div class="ck-console">
              <div class="ck-console__bar">
                <span class="ck-console__title"><svg class="ck-icon" aria-hidden="true"><use href="#i-terminal"/></svg><span id="console-title">Console</span></span>
                <div class="ck-chips" id="console-chips">
                  <span class="ck-text-caption">Raccourcis</span>
                </div>
              </div>
              <pre class="ck-console__output" id="console-output" aria-live="polite"></pre>
              <form class="ck-console__prompt" id="console-form">
                <div class="ck-input-group">
                  <span class="ck-input-group__addon">$</span>
                  <input class="ck-input ck-input--mono" id="console-input" name="command" required autocomplete="off" maxlength="500" placeholder="Commande (ex. ls -la)…" aria-label="Commande">
                </div>
                <button type="submit" class="ck-btn ck-btn--primary" id="console-run">
                  <svg class="ck-icon" aria-hidden="true"><use href="#i-play"/></svg><span>Exécuter</span>
                </button>
              </form>
            </div>

            <div class="ck-console">
              <div class="ck-console__bar">
                <span class="ck-console__title"><svg class="ck-icon" aria-hidden="true"><use href="#i-file-text"/></svg>Journaux du conteneur</span>
                <div class="ck-cluster">
                  <label class="ck-check">
                    <input type="checkbox" class="ck-checkbox" id="logs-follow" checked>
                    <span>Suivre en direct</span>
                  </label>
                  <button type="button" class="ck-btn ck-btn--ghost ck-btn--xs" id="logs-clear">
                    <svg class="ck-icon" aria-hidden="true"><use href="#i-trash"/></svg><span>Effacer l'affichage</span>
                  </button>
                  <button type="button" class="ck-btn ck-btn--ghost ck-btn--xs" id="logs-refresh">
                    <svg class="ck-icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>Actualiser</span>
                  </button>
                  <button type="button" class="ck-btn ck-btn--ghost ck-btn--xs ck-btn--icon" id="logs-bottom" aria-label="Aller en bas" title="Aller en bas">
                    <svg class="ck-icon" aria-hidden="true"><use href="#i-chevron-down"/></svg>
                  </button>
                </div>
              </div>
              <pre class="ck-console__output" id="logs-output"></pre>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="modal-container"></div>

    <!-- @include scripts.html -->
    <script>
    (function () {
      'use strict';
      const { h, fmt } = UI;
      const $ = (id) => document.getElementById(id);
      const siteId = App.param('id') || '';
      const api = (suffix) => `/admin/api/sites/${encodeURIComponent(siteId)}${suffix || ''}`;
      const SHORTCUTS = ['ls -la', 'cat index.html | head -40', 'df -h', 'ps aux', 'uptime', 'du -sh .'];
      const TRANSITIONAL = ['starting', 'stopping'];
      let site = null;
      let poller = null;
      let logsCleared = false;

      /* ---------- En-tête & bandeau ---------- */
      function renderHead() {
        document.title = `VPS · ${site.name} · Cockpit WaaS`;
        UI.replace($('vps-head'),
          h('div', { class: 'ck-page-head__main' },
            h('a', { class: 'ck-back', href: '/admin/vps' }, UI.icon('arrow-left'), 'Serveur VPS'),
            h('h2', { class: 'ck-page-head__title' }, `VPS · ${site.name}`, UI.statusBadge(site.status), site.port ? UI.tag(`:${site.port}`, { mono: true }) : null),
            h('div', { class: 'ck-page-head__meta' }, h('span', { class: 'ck-mono' }, site.container_name), h('span', { 'aria-hidden': 'true' }, '·'), h('span', { class: 'ck-mono' }, site.image || 'image inconnue'))),
          h('div', { class: 'ck-page-head__actions' },
            site.url ? UI.btn('Visiter', { href: site.url, icon: 'external', size: 'sm', external: true }) : UI.btn('Visiter', { icon: 'external', size: 'sm', disabled: true, title: 'Aucun port attribué' }),
            UI.btn('Fiche du site', { href: `/admin/sites/detail?id=${encodeURIComponent(site.site_id)}`, icon: 'globe', size: 'sm' })));
        $('console-title').textContent = `Console · ${site.site_id}`;
      }

      function renderBanner() {
        const box = $('vps-banner');
        let content = null;
        if (site.status === 'not_provisioned') {
          content = UI.alert({ tone: 'info', icon: 'rocket', title: 'Serveur non déployé',
            text: 'La fiche existe mais aucun conteneur ne tourne. Déployez-le depuis le dépôt Git enregistré.',
            actions: [UI.btn('Déployer le serveur', { variant: 'primary', size: 'sm', icon: 'rocket', onClick: (e) => act('rebuild', e.currentTarget) })] });
        } else if (App.param('deployed') && !site.running) {
          content = UI.alert({ tone: 'info', icon: 'refresh', title: 'Déploiement en cours', text: 'Le conteneur clone le template puis synchronise le contenu éditable : suivez la progression dans les journaux ci-dessous.' });
        } else if (site.status === 'restarting' || site.status === 'error') {
          content = UI.alert({ tone: 'danger', bar: true, icon: 'alert-circle', title: site.status === 'restarting' ? 'Crashloop détecté' : 'Conteneur en erreur',
            text: `Code de sortie ${site.exit_code ?? '—'} · ${site.restart_count || 0} redémarrage(s). Consultez les journaux, puis relancez ou reconstruisez le conteneur.` });
        }
        box.hidden = !content;
        if (content) UI.replace(box, content);
      }

      /* ---------- Panneau de contrôle ---------- */
      async function act(action, button) {
        const confirms = {
          'force-stop': ['Arrêt forcé (SIGKILL) ?', 'Le conteneur est tué immédiatement, sans arrêt propre.', 'Forcer l\'arrêt', 'square'],
          rebuild: ['Reconstruire le conteneur ?', 'Le conteneur est recréé depuis son dépôt (nouveau port possible) ; le contenu éditable est resynchronisé depuis Supabase.', 'Reconstruire', 'hammer'],
          resync: ['Resynchroniser le contenu ?', 'Les textes et images enregistrés dans Supabase pour ce site sont purgés, puis ré-extraits du template au redémarrage. Les modifications faites dans le Studio seront perdues.', 'Purger et redémarrer', 'database']
        };
        if (confirms[action]) {
          const [title, message, label, icon] = confirms[action];
          if (!(await UI.confirm({ title, message, confirmLabel: label, tone: 'danger', icon }))) return;
        }
        const query = action === 'resync' ? { action: 'restart', hard_resync: 'true' } : { action };
        UI.busy(button, true);
        try {
          await App.api(api('/action'), { method: 'POST', query });
          Cockpit.toast({ title: 'Action exécutée', message: `${site.name} : ${action === 'resync' ? 'contenu resynchronisé' : action}`, tone: 'good', duration: 2600 });
          await load();
          await loadLogs(true);
        } catch (error) {
          App.toastError(error);
        } finally {
          UI.busy(button, false);
        }
      }

      async function destroy() {
        const input = UI.input('confirm', { id: 'confirm-id', mono: true, placeholder: site.site_id });
        const ok = await UI.confirm({
          title: 'Supprimer définitivement ce serveur ?',
          message: `Le conteneur, son volume, son contenu éditable, sa fiche, ses sondes et son trafic sont supprimés. Factures et échanges sont conservés. Saisissez « ${site.site_id} » pour confirmer.`,
          extra: UI.field('Identifiant du site', input), confirmLabel: 'Supprimer définitivement', tone: 'danger', icon: 'trash'
        });
        if (!ok) return;
        if (input.value.trim() !== site.site_id) {
          Cockpit.toast({ title: 'Suppression annulée', message: "L'identifiant saisi ne correspond pas.", tone: 'warn' });
          return;
        }
        try {
          await App.api(api(), { method: 'DELETE', query: { purge_record: 'true' } });
          App.toastOk('Serveur supprimé', site.name);
          window.setTimeout(() => { window.location.href = '/admin/vps'; }, 800);
        } catch (error) {
          App.toastError(error, 'Suppression impossible');
        }
      }

      function renderPanel() {
        const b = (label, action, variant, icon, title) => UI.btn(label, { variant, size: 'sm', icon, title, onClick: (e) => act(action, e.currentTarget) });
        const del = UI.btn('Supprimer', { variant: 'danger', size: 'sm', icon: 'trash', class: 'ck-btn--solid', title: 'Supprimer définitivement ce serveur et ses données', onClick: destroy });
        let actions;
        if (site.status === 'not_provisioned') actions = [b('Déployer', 'rebuild', 'primary', 'rocket'), del];
        else if (TRANSITIONAL.includes(site.status)) actions = [h('span', { class: 'ck-busy', role: 'status' }, h('span', { class: 'ck-spinner', 'aria-hidden': 'true' }), UI.statusLabel(site.status)), b('Stop', 'force-stop', 'danger', 'square', 'Arrêt forcé'), del];
        else if (site.running) actions = [b('Arrêter', 'stop', 'secondary', 'power', 'Arrêt gracieux'), b('Stop', 'force-stop', 'danger', 'square', 'Arrêt forcé (SIGKILL)'), b('Redémarrer', 'restart', 'ghost', 'refresh'), b('Reconstruire', 'rebuild', 'ghost', 'hammer', 'Recréer le conteneur depuis son dépôt'), b('Resynchroniser', 'resync', 'ghost', 'database', 'Purger le contenu Supabase puis redémarrer'), del];
        else if (site.status === 'error' || site.status === 'restarting') actions = [b('Relancer', 'restart', 'good', 'play'), b('Stop', 'force-stop', 'danger', 'square'), b('Reconstruire', 'rebuild', 'warn', 'hammer', 'Nettoyer et reconstruire'), del];
        else actions = [b('Démarrer', 'start', 'good', 'play'), b('Reconstruire', 'rebuild', 'ghost', 'hammer'), del];
        UI.replace($('vps-actions'), actions);

        $('vps-panel-sub').textContent = `DOCKER · ${site.container_id || 'aucun conteneur'}${site.health ? ` · healthcheck ${site.health}` : ''}`;
        const uptime = h('span', { class: 'ck-mono' }, site.running ? '' : 'Arrêté');
        if (site.running && site.started_at_epoch) {
          uptime.setAttribute('data-started-at', String(site.started_at_epoch));
          uptime.textContent = fmt.duration(Date.now() / 1000 - site.started_at_epoch);
        }
        const ram = site.memory_mb != null ? `${fmt.decimal(site.memory_mb, 1)} Mo${site.memory_limit_mb ? ` / ${fmt.number(site.memory_limit_mb)} Mo` : ''}` : '—';
        UI.replace($('vps-stats'), UI.stats([
          ['Statut', UI.statusBadge(site.status)],
          ['Port', site.port ? `:${site.port}` : '—'],
          ['RAM', ram],
          ['Disque', site.disk_mb != null ? `${fmt.decimal(site.disk_mb, 1)} Mo` : '—'],
          ['CPU', site.cpu_percent != null ? `${fmt.decimal(site.cpu_percent, 1)} %` : '—'],
          ['Processus', site.pids != null ? String(site.pids) : '—'],
          ['Uptime', uptime],
          ['Redémarrages', String(site.restart_count || 0)]
        ]));
      }

      /* ---------- Disponibilité ---------- */
      function renderAvailability(avail) {
        const state = avail.current_state || 'none';
        let note = null;
        if (state === 'down') {
          note = UI.alert({ tone: 'danger', bar: true, title: 'Vitrine injoignable',
            text: `${avail.current_detail || avail.current_code || 'La page d\'accueil ne répond pas.'} Relancez le conteneur puis vérifiez ses journaux.`,
            actions: [UI.btn('Voir les journaux', { size: 'sm', icon: 'file-text', onClick: () => $('logs-output').scrollIntoView({ behavior: 'smooth', block: 'center' }) })] });
        } else if (state === 'degraded') {
          note = UI.alert({ tone: 'warn', title: 'Réponse inattendue', text: avail.current_detail || avail.current_code || 'La vitrine répond, mais pas comme attendu.' });
        } else if (!site.running && Number(avail.applicable) === 0) {
          note = UI.alert({ tone: 'info', icon: 'activity', title: 'Historique en attente',
            text: "Aucune mesure n'est enregistrée pendant l'arrêt (ce n'est pas une panne). Les sondes reprennent automatiquement dès que la vitrine est en ligne." });
        }
        UI.replace($('vps-avail-note'), note ? h('div', { style: { 'margin-bottom': 'var(--ck-space-16)' } }, note) : null);
        UI.replace($('vps-avail'), Views.availabilityBody(avail));
        $('vps-avail-sub').textContent = `${site.site_id} · page d'accueil sondée par le serveur à chaque cycle`;
      }

      $('btn-probe').addEventListener('click', async (event) => {
        const button = event.currentTarget;
        UI.busy(button, true, 'Contrôle…');
        try {
          const res = await App.api(api('/probe'), { method: 'POST' });
          renderAvailability(res.availability);
          const state = res.availability.current_state;
          Cockpit.toast({ title: 'Contrôle effectué', message: `${res.result.probed} sonde(s) · état : ${UI.statusLabel(state)}`, tone: state === 'up' ? 'good' : state === 'down' ? 'danger' : 'info', duration: 3000 });
        } catch (error) {
          App.toastError(error);
        } finally {
          UI.busy(button, false);
        }
      });

      /* ---------- Console ---------- */
      const output = $('console-output');
      function print(nodes) {
        const nearBottom = output.scrollHeight - output.scrollTop - output.clientHeight < 120;
        UI.append(output, nodes);
        if (nearBottom) output.scrollTop = output.scrollHeight;
      }
      print(Views.consoleLine('# Prêt. Les commandes s\'exécutent dans le conteneur (utilisateur non privilégié, 10 s max).', 'sys'));

      async function runCommand(command) {
        const button = $('console-run');
        print(Views.consoleLine(command, 'cmd'));
        UI.busy(button, true);
        try {
          const res = await App.api(api('/exec'), { method: 'POST', body: { command } });
          const lines = (res.output || '').replace(/\n$/, '').split('\n');
          print(lines.map((line) => Views.consoleLine(line, res.exit_code ? 'err' : null)));
          if (res.truncated) print(Views.consoleLine('[sortie tronquée à 64 Ko]', 'warn'));
          print(Views.consoleLine(`[code ${res.exit_code} · ${fmt.number(res.duration_ms)} ms${res.timed_out ? ' · délai dépassé' : ''}]`, res.exit_code ? 'warn' : 'sys'));
        } catch (error) {
          print(Views.consoleLine(error.message, 'err'));
        } finally {
          UI.busy(button, false);
          $('console-input').focus();
        }
      }

      SHORTCUTS.forEach((cmd) => $('console-chips').appendChild(h('button', { type: 'button', class: 'ck-chip', on: { click: () => runCommand(cmd) } }, cmd)));
      const history = [];
      let historyIndex = -1;
      $('console-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const command = $('console-input').value.trim();
        if (!command) return;
        history.unshift(command);
        historyIndex = -1;
        $('console-input').value = '';
        runCommand(command);
      });
      $('console-input').addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
        event.preventDefault();
        historyIndex = Math.max(-1, Math.min(history.length - 1, historyIndex + (event.key === 'ArrowUp' ? 1 : -1)));
        event.target.value = historyIndex >= 0 ? history[historyIndex] : '';
      });

      /* ---------- Journaux ---------- */
      const logs = $('logs-output');
      async function loadLogs(force) {
        if (!force && (!$('logs-follow').checked || logsCleared)) return;
        if (!site || site.status === 'not_provisioned') {
          UI.replace(logs, Views.consoleLine('Aucun conteneur : aucun journal.', 'sys'));
          return;
        }
        try {
          const res = await App.api(api('/logs'), { query: { tail: 200 } });
          const nearBottom = logs.scrollHeight - logs.scrollTop - logs.clientHeight < 150;
          UI.replace(logs, res.logs.length ? Views.logLines(res.logs) : Views.consoleLine('[Aucun journal récent pour ce conteneur]', 'sys'));
          if (nearBottom || force) logs.scrollTop = logs.scrollHeight;
          logsCleared = false;
        } catch (error) {
          UI.replace(logs, Views.consoleLine(`Journaux indisponibles : ${error.message}`, 'err'));
        }
      }
      $('logs-refresh').addEventListener('click', () => loadLogs(true));
      $('logs-clear').addEventListener('click', () => {
        logsCleared = true;
        UI.replace(logs, Views.consoleLine(`[${fmt.time(new Date())}] Affichage effacé — « Actualiser » recharge les journaux.`, 'sys'));
      });
      $('logs-bottom').addEventListener('click', () => { logs.scrollTop = logs.scrollHeight; });
      $('logs-follow').addEventListener('change', (event) => { if (event.target.checked) { logsCleared = false; loadLogs(true); } });

      /* ---------- Chargement & sondage ---------- */
      async function load() {
        const data = await App.api(api());
        site = data.site;
        renderHead();
        renderBanner();
        renderPanel();
        renderAvailability(data.availability);
        schedule(TRANSITIONAL.includes(site.status) || App.param('deployed') ? 3000 : 8000);
      }

      function schedule(interval) {
        if (poller && poller.interval === interval) return;
        if (poller) poller.stop();
        poller = App.poll(() => Promise.all([load(), loadLogs(false)]).catch(() => {}), interval);
        poller.interval = interval;
      }

      function notFound() {
        UI.replace($('vps-root'), UI.card({ body: UI.empty({
          title: 'Conteneur introuvable', desc: "Ce site n'existe pas ou n'a pas de conteneur.", icon: 'server',
          actions: [UI.btn('Retour à la flotte', { href: '/admin/vps', variant: 'primary', size: 'sm' })]
        }) }));
      }

      App.onRefresh(() => Promise.all([load(), loadLogs(true)]));
      App.boot(async ({ status }) => {
        status('Connexion au conteneur…');
        try {
          await load();
        } catch (error) {
          if (error.status === 404) { notFound(); return; }
          throw error;
        }
        status('Lecture des journaux…');
        await loadLogs(true);
      }, { shell: 'admin' });
    })();
    </script>
  </body>
</html>
