<!-- Squelette : fil de discussion (Views.threadCard) — en-tête, messages, composeur. -->
<article class="ck-card ck-thread ck-skeleton-thread" aria-hidden="true">
  <header class="ck-card__header">
    <div class="ck-card__heading">
      <span class="ck-skeleton ck-skeleton--title ck-skeleton--w40"></span>
      <span class="ck-skeleton ck-skeleton--text ck-skeleton--w30"></span>
    </div>
    <div class="ck-card__actions"><span class="ck-skeleton ck-skeleton--pill"></span></div>
  </header>
  <div class="ck-thread__stream">
    <div class="ck-msg ck-msg--client">
      <span class="ck-skeleton ck-skeleton--text ck-skeleton--w45"></span>
      <span class="ck-skeleton ck-skeleton--block ck-skeleton--w100"></span>
    </div>
    <div class="ck-msg ck-msg--agency">
      <span class="ck-skeleton ck-skeleton--text ck-skeleton--w35 ck-skeleton--end"></span>
      <span class="ck-skeleton ck-skeleton--block ck-skeleton--w100"></span>
    </div>
    <div class="ck-msg ck-msg--client">
      <span class="ck-skeleton ck-skeleton--text ck-skeleton--w50"></span>
      <span class="ck-skeleton ck-skeleton--block ck-skeleton--w100"></span>
    </div>
  </div>
  <div class="ck-composer">
    <span class="ck-skeleton ck-skeleton--block"></span>
    <div class="ck-composer__foot">
      <span class="ck-skeleton ck-skeleton--text ck-skeleton--w35"></span>
      <span class="ck-skeleton ck-skeleton--pill"></span>
    </div>
  </div>
</article>
