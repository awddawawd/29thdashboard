<!-- Squelette : carte complète (en-tête + corps) — pour les piles de cartes
     entièrement construites par le JS (réglages, groupes de formulaires). -->
<article class="ck-card" aria-hidden="true">
  <header class="ck-card__header">
    <div class="ck-card__heading">
      <span class="ck-skeleton ck-skeleton--title ck-skeleton--w25"></span>
      <span class="ck-skeleton ck-skeleton--text ck-skeleton--w45"></span>
    </div>
  </header>
  <div class="ck-card__body ck-skeleton-panel">
    <span class="ck-skeleton ck-skeleton--text ck-skeleton--w25"></span>
    <span class="ck-skeleton ck-skeleton--text ck-skeleton--w65"></span>
    <span class="ck-skeleton ck-skeleton--text ck-skeleton--w85"></span>
    <span class="ck-skeleton ck-skeleton--text ck-skeleton--w55"></span>
  </div>
</article>
