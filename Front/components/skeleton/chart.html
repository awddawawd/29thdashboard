<!-- Squelette : graphique en courbe — légende + aire de tracé de même hauteur que
     Cockpit.charts.line() ; remplacé par Views.trafficChart / le tracé réel. -->
<figure class="ck-chart" style="--ck-chart-h: 240px" aria-hidden="true">
  <div class="ck-chart__head">
    <div class="ck-legend">
      <span class="ck-legend__item"><span class="ck-skeleton ck-skeleton--pill"></span></span>
      <span class="ck-legend__item"><span class="ck-skeleton ck-skeleton--pill"></span></span>
    </div>
  </div>
  <div class="ck-chart__plot">
    <div class="ck-skeleton-plot">
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
      <span class="ck-skeleton"></span>
    </div>
  </div>
</figure>
